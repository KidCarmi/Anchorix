# Anchorix v0.1 — local development stack.
#
# !!! DEVELOPMENT AND DEMO USE ONLY !!!
#
# This compose file is NOT a production deployment template. In particular:
#
#   * It binds PostgreSQL on 0.0.0.0:5432 for developer convenience.
#     NEVER expose this port on a non-trusted network. Production
#     deployments must keep PostgreSQL on a private network and reachable
#     only from the control plane.
#   * It binds the control plane on 0.0.0.0:8080 over plain HTTP. Production
#     deployments must front the API with a TLS-terminating reverse proxy
#     (or set ANCHORIX_TLS_TERMINATION=process with cert/key files).
#   * It binds the Vite/Nginx UI on 0.0.0.0:5173 over plain HTTP.
#   * The example credentials in .env are placeholders. Use real secrets
#     in any environment that is not your laptop.
#
# Production deployments should derive a separate compose file (see
# deploy/compose/README.md) that disables the Postgres port mapping,
# adds a reverse proxy, and sources secrets from a real secret store.
#
# Per CLAUDE.md, the control plane is a single Go binary; the frontend is a
# static SPA. PostgreSQL holds all durable state.

name: anchorix

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anchorix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-anchorix}
    volumes:
      - anchorix_pg_data:/var/lib/postgresql/data
    # WARNING: dev-only port mapping. See top-of-file note. Production
    # compose files MUST omit this `ports:` block so PostgreSQL stays on
    # the internal Docker network only.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anchorix} -d ${POSTGRES_DB:-anchorix}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANCHORIX_ENV: ${ANCHORIX_ENV:-development}
      ANCHORIX_LOG_LEVEL: ${ANCHORIX_LOG_LEVEL:-info}
      ANCHORIX_HTTP_ADDR: 0.0.0.0:8080
      ANCHORIX_PUBLIC_BASE_URL: ${ANCHORIX_PUBLIC_BASE_URL:-http://localhost:8080}
      ANCHORIX_SESSION_KEY: ${ANCHORIX_SESSION_KEY}
      ANCHORIX_TLS_TERMINATION: ${ANCHORIX_TLS_TERMINATION:-disabled_dev}
      DATABASE_URL: ${DATABASE_URL:-postgres://anchorix:change-me-locally@postgres:5432/anchorix?sslmode=disable}
      ANCHORIX_ENROLLMENT_TOKEN_TTL: ${ANCHORIX_ENROLLMENT_TOKEN_TTL:-15m}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/anchorix", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "5173:5173"

volumes:
  anchorix_pg_data:
    driver: local
