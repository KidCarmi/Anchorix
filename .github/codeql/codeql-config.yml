# ============================================================
# CodeQL configuration — Anchorix
#
# Used by .github/workflows/codeql.yml via `config-file:`. Keeps
# `queries: security-extended` as the default breadth
# (CLAUDE.md §11 binding) and excludes ONE narrow test-fixture
# path from analysis.
#
# Path exclusions here are subject to the same discipline as
# dependency-obituary `.depobituaryignore` entries (CLAUDE.md
# §11 — explicit, narrow, reversible, justified). Adding new
# entries requires either a clear test-only rationale or a
# CLAUDE.md amendment.
# ============================================================

name: anchorix-codeql

# Inherit the workflow's `queries: security-extended` setting.
# Listed explicitly so future readers don't have to cross-
# reference the workflow file to know which suite is running.
queries:
  - uses: security-extended

# Path exclusions.
#
# `backend/internal/inventory/fixtures/` is a deterministic
# test-data builder whose job is to mint cert inputs that fire
# every rule in the certificate-findings registry, including
# `weak_rsa_key` (RSA bits < 2048). Without 1024-bit RSA keys
# the fixture cannot exercise that rule's match path; the
# alternative (dropping the weak-key fixture bucket) would
# silently weaken the perf-tier and findings test coverage.
#
# The package is test-flavored (never imported by
# `cmd/anchorix`), documented as such in its `doc.go`, and uses
# `crypto/rand.Reader` for all randomness — the only remaining
# CodeQL finding here is `go/weak-cryptographic-key` on the
# intentional 1024-bit keys.
#
# CodeQL configs cannot express per-(path, query) exclusions;
# `query-filters: exclude` is global to the analysis, which is
# too broad (it would silence the query for real production
# code). Excluding the fixture path entirely is the narrowest
# practical option: it skips all queries for one small
# test-only directory rather than losing one query repo-wide.
#
# This is the only exclusion. Every other path in the
# repository continues to run at security-extended breadth.
paths-ignore:
  - backend/internal/inventory/fixtures
