# Vulnerability and secret-scanning gates.
#
# All jobs in this workflow are BLOCKING. They are deterministic given a
# fixed commit + an upstream advisory database; transient registry outages
# are the only realistic flake source, and we surface those as real
# failures rather than silently passing.

name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # govulncheck — Go module vulnerability scanner. Run independently per
  # module so a problem in one doesn't mask a problem in the other.
  # ---------------------------------------------------------------------------
  govulncheck-backend:
    name: govulncheck (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.24"
          work-dir: backend

  govulncheck-agent:
    name: govulncheck (agent/windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.24"
          work-dir: agent/windows

  # ---------------------------------------------------------------------------
  # npm audit — fails on high or critical advisories. Uses the committed
  # package-lock.json (frontend/package-lock.json) so results are
  # reproducible across runs.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Trivy — filesystem vulnerability scan. Fails on HIGH/CRITICAL findings
  # in OS packages, language deps, IaC, and secrets in the working tree.
  # ---------------------------------------------------------------------------
  trivy:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        # NOTE on pinning: the `0.28.0` tag I used previously does not
        # exist on aquasecurity/trivy-action. `master` is the action's
        # own canonical reference and is what its README recommends.
        # Pin to a SHA once a verified release tag is available.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          # SARIF upload happens in a separate step so a scan failure still
          # surfaces results in the Security tab.
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # Gitleaks — secret scanner. Blocks on any detected secret in the diff or
  # history. License env var is only required for organization repos.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs full history for redacted-commit detection.
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional; required only for org-owned repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
