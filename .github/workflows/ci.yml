# Anchorix CI — code quality, smoke validation, and Docker build gates.
#
# This file is one of four CI workflows. The others handle CodeQL, vulnerability
# scanning + secrets, and Dependency Obituary. Splitting them keeps each file
# small and lets failures be diagnosed without scrolling.
#
# Every job here is BLOCKING — failures must prevent merge.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # We use "stable" so build, test, and govulncheck all run against the
  # same patched stdlib. Pinning a fixed minor here while govulncheck
  # ran on a different version would create a real coverage gap (the
  # binary we test could carry CVEs the scanner would never see).
  # Both Go modules declare `go 1.24`, which is the floor — the actual
  # toolchain is whatever `stable` resolves to (>= 1.24).
  GO_VERSION: "stable"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend Go quality
  # ---------------------------------------------------------------------------
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PR-002 adds a postgres service container so the integration
    # tests under backend/test/integration/ can exercise the real
    # storage layer. The password is a synthetic CI-only credential
    # scoped to this ephemeral service (CI_PLAN.md): not a secret,
    # not to be reused outside CI, must not be moved to the secrets
    # store. The container is created and destroyed inside this job
    # and is not reachable from outside the runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anchorix
          POSTGRES_PASSWORD: ci-test-postgres
          POSTGRES_DB: anchorix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anchorix -d anchorix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (unit)
        run: go test -count=1 ./...

      - name: go build
        run: go build ./...

      - name: migrate up
        env:
          ANCHORIX_ENV: development
          ANCHORIX_SESSION_KEY: ci-test-session-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DATABASE_URL: postgres://anchorix:ci-test-postgres@localhost:5432/anchorix?sslmode=disable
        run: go run ./cmd/anchorix migrate up

      - name: go test (integration)
        env:
          ANCHORIX_ENV: development
          ANCHORIX_SESSION_KEY: ci-test-session-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DATABASE_URL: postgres://anchorix:ci-test-postgres@localhost:5432/anchorix?sslmode=disable
        run: go test -count=1 -tags=integration ./test/integration/...

  # ---------------------------------------------------------------------------
  # Agent Go quality. Includes a Windows cross-compile to verify build tags.
  # ---------------------------------------------------------------------------
  agent:
    name: agent/windows (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go build (linux dev stub)
        run: go build ./...

      - name: go build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  # ---------------------------------------------------------------------------
  # Frontend quality
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm test
        run: npm test -- --run

      - name: npm run build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: compose config validation, image builds, and a runtime smoke test
  # against /healthz and /readyz.
  # ---------------------------------------------------------------------------
  docker:
    name: docker (config + build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dev .env
        run: ./scripts/dev-env.sh

      - name: docker compose config (validate)
        run: docker compose config -q

      - name: Build api image
        run: docker compose build api

      - name: Build web image
        run: docker compose build web

      # PR-002: `anchorix serve` now calls EnsureSchema and refuses to
      # start when the DB is behind the binary (CLAUDE.md §16, §6.12).
      # The smoke flow must therefore bring postgres up first, run the
      # explicit migration step, and only then start the api.
      - name: Bring up postgres
        run: docker compose up -d --wait postgres
        timeout-minutes: 2

      - name: Run migrations
        # The api image's ENTRYPOINT is `/anchorix`; only the
        # subcommand goes here (passing /anchorix again would feed
        # it as the first argument and `anchorix: unknown command
        # "/anchorix"` would result).
        run: docker compose run --rm api migrate up

      - name: Bring up api
        run: docker compose up -d --wait api
        timeout-minutes: 3

      - name: Smoke /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/healthz.json -w "%{http_code}" http://localhost:8080/healthz || true)
            if [ "$code" = "200" ]; then
              echo "healthz returned 200"
              cat /tmp/healthz.json
              echo
              break
            fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::/healthz never returned 200"
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/healthz.json

      - name: Smoke /readyz
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/readyz.json -w "%{http_code}" http://localhost:8080/readyz)
          echo "readyz HTTP $code:"
          cat /tmp/readyz.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::/readyz returned $code, expected 200"
            exit 1
          fi
          grep -q '"status":"ready"' /tmp/readyz.json
          # Postgres probe is registered in PR-002 and must report ok.
          grep -q '"postgres":"ok"' /tmp/readyz.json

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans -v
