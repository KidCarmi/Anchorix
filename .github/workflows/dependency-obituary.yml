# Dependency Obituary — direct-dependency health gate.
#
# Scope (binding, see CLAUDE.md §11 and docs/BRANCHING.md §2):
#
#   * BLOCKING: direct frontend dependencies (frontend/package.json),
#     threshold 60.
#   * NOT GATED HERE: transitive dependencies. Transitive CVE risk is
#     already covered by `npm audit --audit-level=high` and the Trivy
#     filesystem scan (both blocking).
#
# Exclusions (binding, see CLAUDE.md §11):
#
#   The action loads exclusions from `.depobituaryignore` at the repo
#   root (gitignore-style, one exact package name per line, comments
#   prefixed with `#`). Excluded packages are still scored and shown
#   in the report tagged IGNORED — they just do not count toward the
#   threshold-fail decision.
#
#   The current allowed exclusion is exactly one package:
#   - eslint-plugin-react
#
#   Wildcard / pattern entries are FORBIDDEN by Anchorix policy
#   regardless of what the action accepts. Every entry must be an
#   exact package name. See `.depobituaryignore` for the rationale.
#
# Forbidden (per CLAUDE.md):
#   - threshold lowered
#   - continue-on-error
#   - wildcard / pattern exclusions
#   - any allowlist beyond the explicit named entries in
#     .depobituaryignore

name: dependency-obituary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: obituary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obituary:
    name: dependency obituary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Direct deps only: package.json (NOT package-lock.json).
      # Threshold stays at 60.
      #
      # Exclusions are file-based at the repo root (.depobituaryignore).
      # That file is the SOURCE OF TRUTH — do NOT add an `exclude:`
      # input here, and do NOT pass package names through the workflow.
      # Keeping the rule list in the file makes diff review obvious
      # and lets bin/check.js's loadAllowlist() pick it up unchanged.
      - name: Dependency Obituary (direct deps)
        uses: KidCarmi/Dependency-Obituary@main
        with:
          threshold: "60"
          file: frontend/package.json
