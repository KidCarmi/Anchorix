# Dependency Obituary — direct-dependency health gate.
#
# Scope (binding, see CLAUDE.md §11 and docs/BRANCHING.md §2):
#
#   * BLOCKING: direct frontend dependencies (frontend/package.json),
#     threshold 60.
#   * NOT GATED HERE: transitive dependencies. Transitive CVE risk is
#     already covered by `npm audit --audit-level=high` and the Trivy
#     filesystem scan (both blocking).
#
# Exclusions (see CLAUDE.md §11):
#
#   * eslint-plugin-react — explicitly excluded by exact package name
#     (NOT a pattern). The plugin currently scores 45 in the obituary
#     DB, but it remains the de-facto React linting plugin and is
#     useful for future frontend maturity. Excluding it lets v0.1
#     ship without retiring the linter or downgrading the threshold.
#     Reversible: delete the `exclude:` input below to re-arm the gate
#     for this package. No other exclusions are permitted.
#
# Forbidden (per CLAUDE.md):
#   - threshold lowered
#   - continue-on-error
#   - wildcard / pattern exclusions
#   - any allowlist beyond the single package above

name: dependency-obituary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: obituary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obituary:
    name: dependency obituary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Direct deps only: package.json (NOT package-lock.json).
      # Threshold stays at 60.
      #
      # `exclude` is a single explicit package name — eslint-plugin-react —
      # not a pattern. Rationale and reversibility are documented in the
      # top-of-file comment block and in CLAUDE.md §11. If the action's
      # exclusion input is named differently than `exclude`, its own
      # warning will report the correct key (the action surfaced that
      # behaviour previously when `path` was given instead of `file`),
      # and we will adjust to the canonical name on the next push.
      - name: Dependency Obituary (direct deps)
        uses: KidCarmi/Dependency-Obituary@main
        with:
          threshold: "60"
          file: frontend/package.json
          exclude: eslint-plugin-react
