# Dependency Obituary — dependency health and abandonment gate.
#
# This is NOT SAST and NOT a CVE scanner. It complements the security
# workflow by surfacing:
#
#   - abandoned upstream packages
#   - archived repositories
#   - deprecated packages
#   - stale maintenance posture
#   - low maintainer activity
#
# Threshold of 60 means CI fails when overall dependency health drops below
# that score. Adjusting the threshold is a CLAUDE.md-level decision, not a
# convenience tweak.

name: dependency-obituary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: obituary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obituary:
    name: dependency obituary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action's valid inputs are: file, threshold, api-url
      # (per its own warning when an unknown input is given).
      #
      # TEMPORARY PIN — revert to @main when upstream PR #63 merges:
      #   https://github.com/KidCarmi/Dependency-Obituary/pull/63
      # Maintainer confirmed (2026-05-08) the parser on `main` drops the
      # first positional argument because `undefined?.startsWith("--")`
      # evaluates falsy in the `args.find(...)` neighbor lookup, so the
      # exact GitHub-Action shape (`<file> --threshold 60`) silently
      # loses <file> and the action errors with
      #   "No dependency file found. Provide a path or run from a
      #    project root."
      # PR #63 replaces the neighbor lookup with an index-based parser
      # driven by a single FLAG_SCHEMA. Pinning to that PR's branch
      # unblocks Anchorix CI without weakening the gate.
      #
      # Anchorix has no root-level package.json — deps live under
      # frontend/. We point the action at the lockfile so it gets the
      # full transitive dependency tree.
      - name: Dependency Obituary
        uses: KidCarmi/Dependency-Obituary@claude/fix-cli-argument-parsing-89Hxy
        with:
          threshold: "60"
          file: frontend/package-lock.json
