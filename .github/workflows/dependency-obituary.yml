# Dependency Obituary — dependency health and abandonment gate.
#
# This is NOT SAST and NOT a CVE scanner. It complements the security
# workflow by surfacing:
#
#   - abandoned upstream packages
#   - archived repositories
#   - deprecated packages
#   - stale maintenance posture
#   - low maintainer activity
#
# Threshold of 60 means CI fails when overall dependency health drops below
# that score. Adjusting the threshold is a CLAUDE.md-level decision, not a
# convenience tweak.

name: dependency-obituary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: obituary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obituary:
    name: dependency obituary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action runs from the repository root by default. Anchorix
      # has no root-level package.json — deps live under frontend/ —
      # so the previous run errored with:
      #   "No dependency file found. Provide a path or run from a
      #    project root."
      # The action's error wording exposes a `path` input. We point
      # it at the frontend tree where package.json + package-lock.json
      # actually live.
      #
      # v0.1 ships only the frontend npm tree under this gate;
      # backend and agent/windows are stdlib-only Go modules with
      # nothing for the obituary action to evaluate yet.
      - name: Dependency Obituary
        uses: KidCarmi/Dependency-Obituary@main
        with:
          threshold: "60"
          path: frontend
