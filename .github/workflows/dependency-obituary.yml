# Dependency Obituary — direct-dependency health gate.
#
# Scope (binding, see CLAUDE.md §11 and docs/BRANCHING.md §2):
#
#   * BLOCKING: direct frontend dependencies (frontend/package.json),
#     threshold 60.
#   * NOT GATED HERE: transitive dependencies. Transitive CVE risk is
#     already covered by `npm audit --audit-level=high` and the Trivy
#     filesystem scan (both blocking).
#
# The choice to scan package.json instead of package-lock.json is a
# policy choice — it intentionally narrows this gate to direct
# dependencies. Anything that contradicts this scope (allowlists,
# continue-on-error, lower threshold) is forbidden by CLAUDE.md.

name: dependency-obituary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: obituary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obituary:
    name: dependency obituary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Direct deps only: package.json (NOT package-lock.json). The
      # action's valid inputs are: file, threshold, api-url. Threshold
      # stays at 60 — lowering or allowlisting is forbidden.
      - name: Dependency Obituary (direct deps)
        uses: KidCarmi/Dependency-Obituary@main
        with:
          threshold: "60"
          file: frontend/package.json
